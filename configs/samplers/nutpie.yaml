prior:
  draws: 8000
  random_seed: 100
initialization:
  rl_init: true
nuts:
  nuts_sampler: nutpie
  draws: 2000
  tune: 2000
  chains: 4
  target_accept: 0.95
  max_treedepth: 13
  random_seed: 101
  target_accept_by_ex:
    - {range: [0, 3000], value: 0.92}
    - {range: [3000, 6000], value: 0.95}
    - {range: [6000, 20000], value: 0.95}
  
  nutpie:
    compile_backend: numba
    cores: 4
    save_warmup: false
    store_divergences: true
    progressbar: true
    use_initial_points: true
