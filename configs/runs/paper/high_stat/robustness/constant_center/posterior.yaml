output_dir: results
dataset_id: paper/high_stat/robustness
run_id: constant_center

mat_path: data/ExEg_1e8.npz

mode: posterior
transform: log

ex_energies: [4000]
rebin_factors: [10, 2]
mat_scale: 1.0
lower_eg_cut: "60keV"

include_background: true
bg_fraction: 0.15
bg_flat_fraction: 0.10

background_model:
  kind: latent_gamma
  a0: 1.0

eg_tail_mass: 1.0e-6

response_db: OSCAR2020
sigma_eg_gen: "30keV"
sigma_eg_unfold: "30keV"

include_ex_smearing: false
fwhm_ex_kev: 150.0

prior_config: configs/priors/gamma_lognormal_mean_constant_center/baseline.yaml
sample_config: configs/samplers/pymc.yaml

save_trace: true
debug: true
rng_seed: 100
