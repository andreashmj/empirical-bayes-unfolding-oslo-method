dataset_kind: experimental
output_dir: results
dataset_id: 28Si
run_id: baseline

prompt_path: data/h_Ex_Eg_28Si_prompt.m
background_path: data/h_Ex_Eg_28Si_bg.m

mode: posterior
transform: log

ex_energies: [6500]
rebin_factors: [4, 1]
lower_eg_cut: "550keV"
eg_margin: "1000keV"

include_background: true

background_model:
  kind: latent_gamma
  a0: 0.1

response_db: OSCAR2020
fwhm_eg_unfold: "30keV"

prior_config: configs/priors/gamma_lognormal_mean_rl/baseline.yaml
sample_config: configs/samplers/pymc.yaml

save_trace: true
debug: true
rng_seed: 100



